{% extends "app/base.html" %}
{% load static %}

{% block title %}Log in — Windward Apps{% endblock %}

{% block content %}
<section class="auth">
  <div class="container">
    <div class="card">
      <form action="/login" method="post">
        <h1>Log in</h1>
        {% csrf_token %}
        {% include "app/_fields.html" %}
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
