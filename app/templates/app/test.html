{% extends "app/base.html" %}
{% load static %}

{% block title %}Test — Windward Apps{% endblock %}

{% block content %}
<section class="page-hero">
  <div class="container">
    <h1>[Test]</h1>
    <p class="lead">Windward Apps test page.</p>
  </div>
</section>
<section class="section">
  <div class="container" id="iframe-container">
    <script>
      (function () {
        var parent = document.getElementById('iframe-container');
        var url = 'https://indicators.windwardapps.com/' + window.location.search;
        var wrap = document.createElement('div');
        wrap.style.cssText = 'display:flex; justify-content:center;';
        wrap.innerHTML = '<iframe src="' + url + '" allow="clipboard-read;" style="border:none; width:1000px; max-width:100%; height:610px;"></iframe>';
        parent.appendChild(wrap);
      })();
    </script>
  </div>
</section>
{% endblock %}
